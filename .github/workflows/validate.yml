name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # (a) FRONTMATTER CHECK
      - name: Frontmatter check (SKILL.md)
        shell: bash
        run: |
          python3 - <<'PY'
          import re, sys

          path = "skills/contextify/SKILL.md"
          try:
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()
          except FileNotFoundError:
              print(f"FAIL: {path} not found")
              sys.exit(1)

          m = re.match(r"^---\s*\n(.*?)\n---\s*(?:\n|$)", text, re.DOTALL)
          if not m:
              print(f"FAIL: no YAML frontmatter block found in {path}")
              sys.exit(1)
          block = m.group(1)

          # Minimal YAML parse for top-level 'name' and 'description'.
          # Supports plain scalars and folded/literal block scalars (>- , | , etc.).
          def parse_frontmatter(block):
              data = {}
              lines = block.split("\n")
              i = 0
              key_re = re.compile(r"^([A-Za-z0-9_-]+):\s*(.*)$")
              while i < len(lines):
                  line = lines[i]
                  if not line.strip() or line.lstrip().startswith("#"):
                      i += 1
                      continue
                  if line[:1] in (" ", "\t"):
                      i += 1
                      continue
                  km = key_re.match(line)
                  if not km:
                      i += 1
                      continue
                  key, rest = km.group(1), km.group(2).strip()
                  if rest.startswith(("|", ">")):
                      collected = []
                      i += 1
                      while i < len(lines):
                          nxt = lines[i]
                          if nxt.strip() == "":
                              collected.append("")
                              i += 1
                              continue
                          if nxt[:1] in (" ", "\t"):
                              collected.append(nxt.strip())
                              i += 1
                          else:
                              break
                      data[key] = " ".join(c for c in collected if c != "").strip()
                      continue
                  val = rest
                  if len(val) >= 2 and val[0] == val[-1] and val[0] in ("'", '"'):
                      val = val[1:-1]
                  data[key] = val
                  i += 1
              return data

          fm = parse_frontmatter(block)
          ok = True

          name = fm.get("name", "")
          # The Agent Skills spec: 1-64 chars, [a-z0-9-], and no leading, trailing or
          # consecutive hyphens. The stricter pattern below rejects all three.
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", name or ""):
              print(f"FAIL: 'name' must match ^[a-z0-9]+(-[a-z0-9]+)*$ "
                    f"(no leading, trailing or consecutive hyphens; got: {name!r})")
              ok = False
          elif len(name) > 64:
              print(f"FAIL: 'name' must be <= 64 chars (got {len(name)})")
              ok = False
          elif name != "contextify":
              print(f"FAIL: 'name' must be 'contextify' to match skills/contextify/ (got {name!r})")
              ok = False
          else:
              print(f"PASS: 'name' is valid ({name!r})")

          desc = fm.get("description", "")
          if not desc or not desc.strip():
              print("FAIL: 'description' must be non-empty")
              ok = False
          elif len(desc) > 1024:
              print(f"FAIL: 'description' must be <= 1024 chars (got {len(desc)})")
              ok = False
          else:
              print(f"PASS: 'description' is valid ({len(desc)} chars)")

          if not ok:
              sys.exit(1)
          print("PASS: frontmatter check passed")
          PY

      # (a2) MANIFEST VERSION AGREEMENT: the four manifests and the changelog must name one
      #      version. A mirror that drifts installs a different plugin than the marketplace shows.
      - name: Manifests parse and agree on the version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, sys

          MANIFESTS = {
              ".claude-plugin/plugin.json": lambda d: d.get("version"),
              ".claude-plugin/marketplace.json": lambda d: (d.get("plugins") or [{}])[0].get("version"),
              ".cursor-plugin/plugin.json": lambda d: d.get("version"),
              ".copilot-plugin/plugin.json": lambda d: d.get("version"),
          }

          ok = True
          versions = {}
          for path, get in MANIFESTS.items():
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)
              except FileNotFoundError:
                  print(f"FAIL: {path} not found")
                  ok = False
                  continue
              except json.JSONDecodeError as e:
                  print(f"FAIL: invalid JSON in {path}: {e}")
                  ok = False
                  continue
              print(f"PASS: {path} parses as valid JSON")
              versions[path] = get(data)

          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  changelog = f.read()
              m = re.search(r"^##\s*\[(\d+\.\d+\.\d+)\]", changelog, re.MULTILINE)
              versions["CHANGELOG.md latest entry"] = m.group(1) if m else None
              if not m:
                  print("FAIL: CHANGELOG.md has no `## [x.y.z]` release heading")
                  ok = False
          except FileNotFoundError:
              print("FAIL: CHANGELOG.md not found")
              ok = False

          distinct = set(versions.values())
          if len(distinct) != 1 or None in distinct:
              print("FAIL: the version must be identical everywhere it is declared:")
              for k, v in versions.items():
                  print(f"  {k} = {v!r}")
              ok = False
          else:
              print(f"PASS: every manifest and CHANGELOG.md name version {distinct.pop()}")

          sys.exit(0 if ok else 1)
          PY

      # (b) SKILL EVAL: the design lock encoded as assertions (RED->GREEN regression guard)
      - name: Skill eval (check_skill.py)
        shell: bash
        run: python3 evals/check_skill.py skills/contextify/SKILL.md

      # (b2) MANIFEST + CONTRACT TESTS: AGENTS.md calls this a release gate, so CI must run it.
      #      Covers manifest validity, version parity, the required-file list, the frontmatter
      #      contract, README link and asset resolution, and i18n parity.
      - name: Manifest and contract tests (test_manifests.py)
        shell: bash
        run: python3 tests/test_manifests.py

      # (c) NO-SECRETS CHECK (all tracked files)
      - name: No secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          files = subprocess.run(
              ["git", "ls-files"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()

          # Provider-specific, length-anchored patterns: broad enough to catch a real
          # leak, narrow enough not to fire on prose that merely mentions a prefix.
          PATTERNS = [
              ("AWS access key id", re.compile(r"AKIA[0-9A-Z]{16}")),
              ("private key header",
               re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----")),
              ("GitHub personal access token", re.compile(r"ghp_[A-Za-z0-9]{36}")),
              ("GitHub fine-grained token", re.compile(r"github_pat_[A-Za-z0-9_]{22,}")),
              ("GitHub OAuth/app/refresh token", re.compile(r"gh[osur]_[A-Za-z0-9]{36}")),
              ("Anthropic API key", re.compile(r"sk-ant-[A-Za-z0-9_\-]{24,}")),
              ("OpenAI-style API key", re.compile(r"sk-(?:proj-)?[A-Za-z0-9]{32,}")),
              ("Slack token", re.compile(r"xox[baprs]-[A-Za-z0-9-]{10,}")),
              ("Slack webhook", re.compile(r"https://hooks\.slack\.com/services/[A-Za-z0-9/+]{20,}")),
              ("Google API key", re.compile(r"AIza[0-9A-Za-z_\-]{35}")),
              ("Stripe secret key", re.compile(r"sk_live_[0-9a-zA-Z]{24,}")),
              ("npm token", re.compile(r"npm_[A-Za-z0-9]{36}")),
              ("Supabase service-role JWT", re.compile(r"eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{40,}\.[A-Za-z0-9_\-]{20,}")),
          ]

          findings = []
          for path in files:
              if path.startswith(".git/") or path == ".git":
                  continue
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      data = f.read()
              except (IsADirectoryError, FileNotFoundError, OSError):
                  continue
              for ln, line in enumerate(data.splitlines(), 1):
                  for kind, rx in PATTERNS:
                      if rx.search(line):
                          findings.append((path, ln, kind))

          if findings:
              print("FAIL: potential secret(s) found:")
              for path, ln, kind in findings:
                  print(f"  {path}:{ln}: {kind}")
              sys.exit(1)
          print(f"PASS: no credentials matched {len(PATTERNS)} secret patterns in tracked files")
          PY

      # (d) MARKUP SAFETY GATE: every shipped SVG *and* the social card must stay
      #     GitHub-safe: no <script>, no external references, well-formed XML for SVGs.
      #     Animated SVGs must also honour prefers-reduced-motion.
      - name: Markup safety (no <script>, no external refs, reduced motion)
        shell: bash
        run: |
          set -o pipefail
          shopt -s nullglob
          fail=0
          for f in assets/*.svg assets/*.html; do
            if grep -q '<script' "$f"; then
              echo "FAIL: <script> found in $f"; fail=1
            fi
            if grep -Eq 'href="https?:|xlink:href="https?:|<image|@import|url\(https?:|src="https?:' "$f"; then
              echo "FAIL: external reference found in $f"; fail=1
            fi
            case "$f" in
              *.svg)
                python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('$f')" \
                  && echo "PASS: $f is well-formed, script-free, self-contained" \
                  || { echo "FAIL: $f is not well-formed XML"; fail=1; }
                if grep -q 'prefers-reduced-motion' "$f"; then
                  echo "PASS: $f honours prefers-reduced-motion"
                else
                  echo "FAIL: $f has no prefers-reduced-motion guard"; fail=1
                fi
                ;;
              *) echo "PASS: $f is script-free and self-contained" ;;
            esac
          done
          exit $fail

      # (e) MARKDOWN LINK CHECK (relative links only; skip http(s)). Runs offline and names the
      #     exact file and target, so it stays the first place to look when a link breaks.
      - name: Markdown relative-link check
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          from urllib.parse import unquote

          md_files = subprocess.run(
              ["git", "ls-files", "*.md"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()

          link_re = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          fence_re = re.compile(r"^\s*(`{3,}|~{3,})")
          inline_code_re = re.compile(r"`[^`]*`")

          broken = []
          checked = 0
          for md in md_files:
              try:
                  with open(md, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()
              except (IsADirectoryError, FileNotFoundError, OSError):
                  continue

              in_fence = False
              base_dir = os.path.dirname(md)
              for line in lines:
                  if fence_re.match(line):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  line = inline_code_re.sub("", line)
                  for raw in link_re.findall(line):
                      target = raw.strip()
                      if " " in target:
                          target = target.split(" ", 1)[0].strip()
                      target = target.strip("<>")
                      if not target:
                          continue
                      low = target.lower()
                      if low.startswith(("http://", "https://", "mailto:", "tel:",
                                         "#", "ftp://", "data:")):
                          continue
                      path_part = target.split("#", 1)[0].split("?", 1)[0]
                      path_part = unquote(path_part)
                      if not path_part:
                          continue
                      if path_part.startswith("/"):
                          resolved = path_part.lstrip("/")
                      else:
                          resolved = os.path.normpath(os.path.join(base_dir, path_part))
                      checked += 1
                      if not os.path.exists(resolved):
                          broken.append((md, target, resolved))

          if broken:
              print("FAIL: broken relative markdown link(s):")
              for md, target, resolved in broken:
                  print(f"  {md}: '{target}' -> '{resolved}' (missing)")
              sys.exit(1)
          print(f"PASS: all {checked} relative markdown link(s) resolve")
          PY

      # (e2) MARKDOWN LINK CHECK (lychee): the remote half of (e).
      # GitHub answers 404 to any non-browser client on /stargazers pages, so the star-badge
      # link is skipped; the token lets lychee resolve other github.com links through the API.
      - name: Markdown link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            --no-progress
            --accept 200,206,403,429
            --exclude linkedin\.com
            --exclude adam-boudjemaa\.com
            --exclude 'github\.com/.*/stargazers'
            --exclude '^https?://(127\.|0\.0\.0\.0|localhost|\[::1\]|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.)'
            --exclude 'evil\.example'
            --exclude 'example\.(com|org|net)'
            './**/*.md'
          fail: true

      # (f) SECRET SCAN (gitleaks, working-tree directory scan)
      # A pinned binary running `gitleaks dir` rather than gitleaks/gitleaks-action@v2, which
      # fails on these repos with "failed to scan Git repository error=stderr is not empty".
      # A directory scan of the working tree does not depend on git history.
      - name: No AI attribution in commit messages
        if: always()
        run: |
          # Local hooks cannot cover every path: `git rebase` does not run commit-msg,
          # `--no-verify` skips it, and squash-merges done on github.com, the GitHub API
          # and Actions never touch a local hook at all. This is the backstop that does.
          #
          # It matches attribution TRAILERS only. Prose naming Claude Code is expected and
          # allowed here, because this repository is a Claude Code plugin.
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [ -z "${{ github.event.before }}" ] || ! git rev-parse -q --verify "${{ github.event.before }}" >/dev/null 2>&1; then
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          fi
          echo "Scanning $RANGE"
          BAD=$(git log --format='%H%x09%B' "$RANGE" 2>/dev/null | grep -i -E \
            -e '^[[:space:]]*Claude-Session:[[:space:]]' \
            -e '^[[:space:]]*Co-?Authored-?By:[[:space:]]*Claude' \
            -e '^[[:space:]]*Co-?Authored-?By:.*@anthropic\.com' \
            -e '^[[:space:]]*(Generated|Co-created) with .*Claude' || true)
          if [ -n "$BAD" ]; then
            echo "::error::AI attribution trailer found in a commit message."
            echo "$BAD"
            echo ""
            echo "Fix: git rebase -i and reword, or install the global hook:"
            echo "  git config --global core.hooksPath ~/.config/git/hooks"
            exit 1
          fi
          echo "No AI attribution trailers found."

      - name: Secret scan (gitleaks)
        shell: bash
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "Downloading $url"
          curl -fsSL -o /tmp/gitleaks.tar.gz "$url"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir . --no-banner --redact --exit-code 1

      # (g) PLUGIN VALIDATION: the Claude CLI is not on a stock GitHub runner, so this is
      #     best-effort here and mandatory locally before a release.
      - name: Plugin validate (if CLI present)
        shell: bash
        run: |
          if command -v claude >/dev/null; then
            claude plugin validate . --strict && claude plugin validate ./.claude-plugin/plugin.json --strict
          else
            echo "claude CLI not on the runner; validate locally before tagging a release"
          fi
